# serpentine iOS app. `make project` (xcodegen) generates Serpentine.xcodeproj (gitignored).
# Layout and settings follow apple-deployment-playbook.md (copied from phubbard/mapbook).
name: Serpentine
options:
  bundleIdPrefix: net.phfactor
  deploymentTarget:
    # 18.4 is the floor: the unified maps.apple.com/directions URL with repeated waypoint= needs it.
    iOS: "18.4"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    # Off so the scheme pre-action can read .git/ for the build number (playbook §5).
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Serpentine:
    type: application
    platform: iOS
    sources:
      - path: Serpentine
    configFiles:
      Debug: Serpentine.xcconfig
      Release: Serpentine.xcconfig
    settings:
      base:
        # The bundle ID is forever (App Store identity + TCC anchor). Never change it.
        PRODUCT_BUNDLE_IDENTIFIER: net.phfactor.serpentine
        PRODUCT_NAME: Serpentine
        MARKETING_VERSION: "0.1.0"
        # CURRENT_PROJECT_VERSION comes from Build.gen.xcconfig (scheme pre-action, git commit count).
        TARGETED_DEVICE_FAMILY: "1,2"
        # Native Catalyst, not "Designed for iPad": the compat layer has TCC bugs (mapbook hit
        # Contacts silently no-opping), and location is the one permission this app cannot lose.
        SUPPORTS_MACCATALYST: YES
        # macOS 15.4 is the twin of iOS 18.4, our floor for the unified Maps URL.
        MACCATALYST_DEPLOYMENT_TARGET: "15.4"
        # Keep net.phfactor.serpentine on the Mac too: one App Store listing, one TCC identity.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_ENTITLEMENTS: Serpentine/Serpentine.entitlements
        ENABLE_PREVIEWS: YES
        # Maintained Info.plist: INFOPLIST_KEY_* auto-injection drops custom keys (playbook §5).
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Serpentine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework

  SerpentineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SerpentineTests
    configFiles:
      Debug: Serpentine.xcconfig
      Release: Serpentine.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.phfactor.serpentineTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Serpentine

schemes:
  Serpentine:
    build:
      preActions:
        - name: Stamp build number from git
          settingsTarget: Serpentine
          script: |
            cd "$SRCROOT" || exit 0
            # No "//" anywhere in these values: xcconfig treats it as a comment and would silently
            # truncate the line. UTC, so a build stamped on the road still sorts.
            DATE=$(date -u +"%Y-%m-%dT%H:%MZ")
            SHA=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
            if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
              SHA="$SHA-dirty"
            fi
            if BUILD=$(git rev-list --count HEAD 2>/dev/null); then
              # Dirty tree: preview the next commit's number.
              if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
                BUILD=$((BUILD + 1))
              fi
            else
              BUILD=1
            fi
            {
              echo "CURRENT_PROJECT_VERSION = $BUILD"
              echo "SERPENTINE_BUILD_DATE = $DATE"
              echo "SERPENTINE_GIT_SHA = $SHA"
            } > "$SRCROOT/Build.gen.xcconfig"
      targets:
        Serpentine: all
        SerpentineTests: [test]
    test:
      targets:
        - SerpentineTests
    run:
      config: Debug
    archive:
      config: Release
