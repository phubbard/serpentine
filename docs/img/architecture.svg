<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="948" viewBox="0 0 1024 948" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<marker id="a-0a6c5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#0a6c5a"/></marker>
<marker id="a-5f5f66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5f5f66"/></marker>
</defs>
<rect width="1024" height="948" fill="#f6f5f2"/>
<text x="32" y="40" font-size="21" font-weight="700" fill="#1d1d1f">Serpentine — how a ride gets planned</text>
<text x="32" y="62" font-size="12.5" fill="#5f5f66">The phone talks to one host and nothing else. Everything third-party is reached from inside the house.</text>
<rect x="32" y="112" width="228" height="112" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="46" y="134" font-size="10" font-weight="700" fill="#0a6c5a" letter-spacing="1">CLIENT</text>
<text x="46" y="156" font-size="15.5" font-weight="700" fill="#1d1d1f">iPhone · iPad · Mac</text>
<text x="46" y="176" font-size="12" fill="#5f5f66">SwiftUI and MapKit. No SDKs, no</text>
<text x="46" y="192" font-size="12" fill="#5f5f66">account, no analytics.</text>
<rect x="276" y="112" width="228" height="112" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="290" y="134" font-size="10" font-weight="700" fill="#5f5f66" letter-spacing="1">CLIENT · IN PROGRESS</text>
<text x="290" y="156" font-size="15.5" font-weight="700" fill="#1d1d1f">Android</text>
<text x="290" y="176" font-size="12" fill="#5f5f66">Compose. A second client, not a</text>
<text x="290" y="192" font-size="12" fill="#5f5f66">reimplementation.</text>
<rect x="520" y="112" width="228" height="112" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="534" y="134" font-size="10" font-weight="700" fill="#0a6c5a" letter-spacing="1">CLIENT</text>
<text x="534" y="156" font-size="15.5" font-weight="700" fill="#1d1d1f">Browser</text>
<text x="534" y="176" font-size="12" fill="#5f5f66">/v1/ — the same planner, in a</text>
<text x="534" y="192" font-size="12" fill="#5f5f66">page.</text>
<rect x="764" y="112" width="228" height="112" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="778" y="134" font-size="10" font-weight="700" fill="#5f5f66" letter-spacing="1">ON THE DEVICE</text>
<text x="778" y="156" font-size="15.5" font-weight="700" fill="#1d1d1f">Apple · Google Maps</text>
<text x="778" y="176" font-size="12" fill="#5f5f66">Voice guidance by handoff: one</text>
<text x="778" y="192" font-size="12" fill="#5f5f66">URL carrying the planned stops.</text>
<path d="M146,112 V92 H878 V108" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<rect x="405" y="78" width="214" height="17" rx="4" fill="#f6f5f2"/>
<text x="512" y="88" font-size="11" font-weight="600" fill="#5f5f66" text-anchor="middle">waypoint URL · stays on the device</text>
<rect x="32" y="276" width="960" height="484" rx="14" fill="none" stroke="#a8491a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="968" y="298" font-size="10" font-weight="700" fill="#a8491a" letter-spacing="1" text-anchor="end">PAUL'S HOUSE · LAN 204.128.136.0/24</text>
<path d="M146,224 V248" fill="none" stroke="#0a6c5a" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M390,224 V248" fill="none" stroke="#0a6c5a" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M634,224 V248" fill="none" stroke="#0a6c5a" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M146,248 H634" stroke="#0a6c5a" stroke-width="1.6" fill="none"/>
<path d="M202,248 V316" fill="none" stroke="#0a6c5a" stroke-width="2.2" marker-end="url(#a-0a6c5a)" stroke-linejoin="round"/>
<text x="660" y="244" font-size="11.5" font-weight="600" fill="#0a6c5a">HTTPS · serpentine.phfactor.net</text>
<text x="660" y="259" font-size="11.5" fill="#5f5f66">the only host any client contacts</text>
<rect x="52" y="316" width="300" height="128" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="66" y="338" font-size="10" font-weight="700" fill="#0a6c5a" letter-spacing="1">INTERNET-FACING</text>
<text x="66" y="360" font-size="15.5" font-weight="700" fill="#1d1d1f">Caddy — webserver (Pi 5)</text>
<text x="66" y="380" font-size="12" fill="#5f5f66">The only host with ports open: 80 and 443.</text>
<text x="66" y="396" font-size="12" fill="#5f5f66">TLS, then reverse_proxy /v1/* → axiom:8990.</text>
<text x="66" y="412" font-size="12" fill="#5f5f66">The log keeps half an IPv4 for 30 days, and</text>
<text x="66" y="428" font-size="12" fill="#5f5f66">no routes.</text>
<rect x="672" y="316" width="300" height="128" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="686" y="338" font-size="10" font-weight="700" fill="#0a6c5a" letter-spacing="1">MONITORING</text>
<text x="686" y="360" font-size="15.5" font-weight="700" fill="#1d1d1f">serpentine-health.timer</text>
<text x="686" y="380" font-size="12" fill="#5f5f66">Every 2 min from the Pi, probing the API and</text>
<text x="686" y="396" font-size="12" fill="#5f5f66">the public URL. Three strikes, then ntfy. On</text>
<text x="686" y="412" font-size="12" fill="#5f5f66">the Pi so the watcher can't share fate with</text>
<text x="686" y="428" font-size="12" fill="#5f5f66">axiom.</text>
<path d="M668,380 H356" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<rect x="488" y="365" width="48" height="17" rx="4" fill="#f6f5f2"/>
<text x="512" y="375" font-size="11" font-weight="600" fill="#5f5f66" text-anchor="middle">probes</text>
<rect x="52" y="468" width="880" height="272" rx="11" fill="#f1efe9" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="72" y="490" font-size="10" font-weight="700" fill="#0a6c5a" letter-spacing="1">AXIOM · MAC STUDIO M4 MAX, 128 GB (.7)</text>
<path d="M202,444 V464" fill="none" stroke="#0a6c5a" stroke-width="2.2" marker-end="url(#a-0a6c5a)" stroke-linejoin="round"/>
<path d="M822,444 V464" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<rect x="72" y="508" width="840" height="76" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="86" y="530" font-size="15.5" font-weight="700" fill="#1d1d1f">serpentine-api :8990</text>
<text x="86" y="550" font-size="12" fill="#5f5f66">Go, stdlib only. Generates and scores rides, runs the energy model, picks the charge stops, builds the Maps handoff and the GPX. A</text>
<text x="86" y="566" font-size="12" fill="#5f5f66">plan lives in memory for up to 24 h, then it is gone — never written to disk, never logged.</text>
<path d="M207,584 V612" fill="none" stroke="#0a6c5a" stroke-width="1.6" marker-end="url(#a-0a6c5a)" stroke-linejoin="round"/>
<rect x="72" y="612" width="269" height="108" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="86" y="634" font-size="15.5" font-weight="700" fill="#1d1d1f">GraphHopper 11 :8989</text>
<text x="86" y="654" font-size="12" fill="#5f5f66">Docker. Whole-US graph: 13 GB, 70 M</text>
<text x="86" y="670" font-size="12" fill="#5f5f66">nodes. Curvy and direct profiles, built</text>
<text x="86" y="686" font-size="12" fill="#5f5f66">offline in 63 min.</text>
<path d="M508,584 V612" fill="none" stroke="#0a6c5a" stroke-width="1.6" marker-end="url(#a-0a6c5a)" stroke-linejoin="round"/>
<rect x="357" y="612" width="269" height="108" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="371" y="634" font-size="15.5" font-weight="700" fill="#1d1d1f">stations.json</text>
<text x="371" y="654" font-size="12" fill="#5f5f66">Every US public charger, fetched once a</text>
<text x="371" y="670" font-size="12" fill="#5f5f66">day. Corridor search runs locally, so a</text>
<text x="371" y="686" font-size="12" fill="#5f5f66">ride costs no third-party call.</text>
<path d="M809,584 V612" fill="none" stroke="#0a6c5a" stroke-width="1.6" marker-end="url(#a-0a6c5a)" stroke-linejoin="round"/>
<rect x="643" y="612" width="269" height="108" rx="9" fill="#ffffff" stroke="#dcd9d2" stroke-width="1.2"/>
<text x="657" y="634" font-size="15.5" font-weight="700" fill="#1d1d1f">stats.db · tile cache</text>
<text x="657" y="654" font-size="12" fill="#5f5f66">Hourly counters: no routes, no</text>
<text x="657" y="670" font-size="12" fill="#5f5f66">locations, nothing tied to a device.</text>
<text x="657" y="686" font-size="12" fill="#5f5f66">Map tiles cached here.</text>
<path d="M146,740 V798" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<path d="M390,740 V798" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<path d="M634,740 V798" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<path d="M960,444 V778 H878 V798" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<rect x="223" y="772" width="89" height="17" rx="4" fill="#f6f5f2"/>
<text x="268" y="782" font-size="11" font-weight="600" fill="#5f5f66" text-anchor="middle">no rider data</text>
<rect x="32" y="798" width="228" height="92" rx="9" fill="#eceae4" stroke="#d6d3cb" stroke-width="1.2"/>
<text x="46" y="820" font-size="10" font-weight="700" fill="#5f5f66" letter-spacing="1">OUTSIDE THE HOUSE</text>
<text x="46" y="842" font-size="15.5" font-weight="700" fill="#1d1d1f">NREL AFDC</text>
<text x="46" y="862" font-size="12" fill="#5f5f66">Charger locations, in bulk, once</text>
<text x="46" y="878" font-size="12" fill="#5f5f66">a day.</text>
<rect x="276" y="798" width="228" height="92" rx="9" fill="#eceae4" stroke="#d6d3cb" stroke-width="1.2"/>
<text x="290" y="820" font-size="10" font-weight="700" fill="#5f5f66" letter-spacing="1">OUTSIDE THE HOUSE</text>
<text x="290" y="842" font-size="15.5" font-weight="700" fill="#1d1d1f">Open Charge Map</text>
<text x="290" y="862" font-size="12" fill="#5f5f66">Is this stop alive? Asked per</text>
<text x="290" y="878" font-size="12" fill="#5f5f66">stop.</text>
<rect x="520" y="798" width="228" height="92" rx="9" fill="#eceae4" stroke="#d6d3cb" stroke-width="1.2"/>
<text x="534" y="820" font-size="10" font-weight="700" fill="#5f5f66" letter-spacing="1">OUTSIDE THE HOUSE</text>
<text x="534" y="842" font-size="15.5" font-weight="700" fill="#1d1d1f">OpenStreetMap</text>
<text x="534" y="862" font-size="12" fill="#5f5f66">Map tiles, cached on axiom.</text>
<rect x="764" y="798" width="228" height="92" rx="9" fill="#eceae4" stroke="#d6d3cb" stroke-width="1.2"/>
<text x="778" y="820" font-size="10" font-weight="700" fill="#5f5f66" letter-spacing="1">OUTSIDE THE HOUSE</text>
<text x="778" y="842" font-size="15.5" font-weight="700" fill="#1d1d1f">ntfy</text>
<text x="778" y="862" font-size="12" fill="#5f5f66">Alerts when the service stops</text>
<text x="778" y="878" font-size="12" fill="#5f5f66">answering.</text>
<path d="M32,916 H62" fill="none" stroke="#0a6c5a" stroke-width="2.2" marker-end="url(#a-0a6c5a)" stroke-linejoin="round"/>
<text x="71" y="920" font-size="11.5" fill="#5f5f66">carries the ride</text>
<path d="M200.6,916 H230.6" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<text x="239.6" y="920" font-size="11.5" fill="#5f5f66">no rider data attached</text>
<path d="M405.79999999999995,916 H435.79999999999995" fill="none" stroke="#5f5f66" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a-5f5f66)" stroke-linejoin="round"/>
<text x="444.79999999999995" y="920" font-size="11.5" fill="#5f5f66">handoff and monitoring</text>
<text x="992" y="920" font-size="11.5" fill="#5f5f66" text-anchor="end">serpentine.phfactor.net</text>
</svg>